version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: education-rates-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: education_rates
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: education-rates-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/education_rates
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - dev

volumes:
  mysql_data:
